name: Build cached packages

on:
  schedule:
    - cron: "0 5 * * *"
  push:
    paths:
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/build-cachix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31

      - uses: cachix/cachix-action@ad2ddac53f961de1989924296a1f236fcfbaa4fc # v15
        with:
          name: atomic-235
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Update flake
        if: github.event_name == 'schedule'
        run: nix flake update

      - name: Build missing packages
        id: build
        run: |
          packages="lazygit tmux opencode"
          built=0
          for p in $packages; do
            out=$(nix eval --impure --raw ".#homeConfigurations.user.pkgs.$p.outPath")
            if nix path-info --store https://atomic-235.cachix.org "$out" >/dev/null 2>&1; then
              echo "$p: already cached"
            else
              echo "$p: building"
              nix build --impure --no-link ".#homeConfigurations.user.pkgs.$p"
              built=1
            fi
          done
          echo "built=$built" >> "$GITHUB_OUTPUT"

      - name: Commit lock
        if: github.event_name == 'schedule' && steps.build.outputs.built == '1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update flake lock"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push
