name: Verify cache

on:
  schedule:
    - cron: "0 8 * * *"
  push:
    paths:
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/build-cachix.yml"
  repository_dispatch:
    types: [shared-updated]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31

      - name: Update flake
        if: github.event_name == 'schedule' || github.event_name == 'repository_dispatch'
        env:
          SHARED_REV: ${{ github.event.client_payload.rev }}
        run: |
          if [ -n "$SHARED_REV" ]; then
            nix flake lock --flake . \
              --override-input shared "github:atomic-235/shared/$SHARED_REV"
          else
            nix flake update
          fi

      - name: Verify packages are cached
        run: |
          packages="lazygit tmux opencode"
          missing=0
          for p in $packages; do
            out=$(nix eval --impure --raw ".#homeConfigurations.user.pkgs.$p.outPath")
            if nix path-info --store https://atomic-235.cachix.org "$out" >/dev/null 2>&1; then
              echo "$p: cached"
            else
              echo "$p: MISSING"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Commit lock
        if: github.event_name == 'schedule' || github.event_name == 'repository_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update flake lock"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/ci/flake-lock
